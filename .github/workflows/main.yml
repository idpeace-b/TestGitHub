name: Salesforce Delta Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - develop
          - sit
          - uat
          - prod

      test_classes:
        description: "Comma-separated test classes"
        required: true
        default: "AccountTriggerTest"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      - name: Install sfdx-git-delta
        run: echo y | sf plugins install sfdx-git-delta

      - name: Set Environment Variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "develop" ]; then
            echo "AUTH_URL=${{ secrets.SF_TEST_DEV }}" >> $GITHUB_ENV
            echo "ENV_NAME=DEV" >> $GITHUB_ENV

          elif [ "${{ github.event.inputs.environment }}" == "sit" ]; then
            echo "AUTH_URL=${{ secrets.SF_TEST_SIT }}" >> $GITHUB_ENV
            echo "ENV_NAME=SIT" >> $GITHUB_ENV

          elif [ "${{ github.event.inputs.environment }}" == "uat" ]; then
            echo "AUTH_URL=${{ secrets.SF_TEST_UAT }}" >> $GITHUB_ENV
            echo "ENV_NAME=UAT" >> $GITHUB_ENV

          elif [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "AUTH_URL=${{ secrets.SF_TEST_PROD }}" >> $GITHUB_ENV
            echo "ENV_NAME=PROD" >> $GITHUB_ENV
          fi

      - name: Authenticate to Salesforce
        run: |
          echo "${{ env.AUTH_URL }}" | sf org login sfdx-url \
            --alias target-org \
            --set-default \
            --sfdx-url-stdin

      - name: Generate Delta Package
        run: |
          mkdir -p delta

          sf sgd source delta \
            --to HEAD \
            --from HEAD~1 \
            --output-dir delta \
            --source-dir force-app \
            --generate-delta

          echo "====== Delta Package ======"
          cat delta/package/package.xml

      - name: Validate Deployment
        run: |
          if grep -q '<members>' delta/package/package.xml; then
            sf project deploy validate \
              --manifest delta/package/package.xml \
              --target-org target-org \
              --test-level RunSpecifiedTests \
              --tests "${{ github.event.inputs.test_classes }}" \
              --wait 60
          else
            echo "No Salesforce metadata changes found."
          fi

      - name: Deploy Delta
        run: |
          if grep -q '<members>' delta/package/package.xml; then
            sf project deploy start \
              --manifest delta/package/package.xml \
              --target-org target-org \
              --test-level RunSpecifiedTests \
              --tests "${{ github.event.inputs.test_classes }}" \
              --wait 60
          else
            echo "No Salesforce metadata changes found."
          fi

      - name: Deploy Destructive Changes
        run: |
          if [ -f "delta/destructiveChanges/destructiveChanges.xml" ] && \
             grep -q '<types>' delta/destructiveChanges/destructiveChanges.xml; then

            sf project deploy start \
              --manifest delta/destructiveChanges/package.xml \
              --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
              --target-org target-org \
              --test-level RunSpecifiedTests \
              --tests "${{ github.event.inputs.test_classes }}" \
              --wait 60

          else
            echo "No destructive changes found."
          fi